name: Rotate Cloudflare deploy token

# Two-token rotation. Cloudflare forbids an API-minted token from carrying the
# "User → API Tokens → Edit" permission (error 1001: "sub-token is not allowed
# to have permissions to manage other tokens"), so a single token can NEVER mint
# its own faithful replacement — something durable must hold the token-management
# permission. This is the production pattern (the same shape a Vault/Doppler
# setup uses): a privileged rotator, quarantined away from the deploy path, mints
# a short-lived, least-privilege operational token.
#
#   CF_ROTATOR_TOKEN     durable USER token, set once by hand, NEVER rotated,
#   (secret)             used ONLY by this job. Needs three permissions:
#                          - Account → Cloudflare Pages → Edit
#                          - Zone    → Cache Purge         (ineil77.dev zone)
#                          - User    → API Tokens → Edit
#                        (Pages + Cache Purge are required so it is ALLOWED to
#                        grant those to the deploy token it creates.)
#
#   CLOUDFLARE_API_TOKEN the DEPLOY token used by deploy.yml (wrangler + cache
#   (secret)             purge). ROTATED here: a fresh deploy-only copy carrying
#                        just Pages·Edit + Cache Purge (NO token management, so
#                        Cloudflare accepts it) is minted each run.
#
# Each run: mint a new deploy-only token, GET-compare its normalized policies +
# verify it is active, persist it over CLOUDFLARE_API_TOKEN, and only THEN retire
# the previous deploy token. The old deploy token stays valid throughout, so a
# mid-run crash can never leave a stale secret that 403s deploys — worst case is
# an orphaned token, never an outage. The rotator is never deleted.
on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month
  workflow_dispatch:

concurrency:
  group: rotate-cf-token
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rotate:
    # Skip scheduled runs until the CI App is configured (avoids noisy failures).
    if: ${{ vars.CI_APP_CLIENT_ID != '' }}
    # Pinned so a runner-image migration can't change the environment underneath
    # a workflow that only runs monthly; bump deliberately.
    runs-on: ubuntu-24.04
    steps:
      - name: "Mint GitHub App token (Secrets: write)"
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ineil77.dev

      - name: Rotate the deploy token (mint deploy-only copy, verify, retire old)
        env:
          CF_ROTATOR_TOKEN: ${{ secrets.CF_ROTATOR_TOKEN }}
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"

          # No-op (green) until the rotator secret is configured, so scheduled
          # runs don't fail noisily before the one-time setup is done.
          if [ -z "${CF_ROTATOR_TOKEN:-}" ]; then
            echo "::warning::CF_ROTATOR_TOKEN is not set — skipping rotation. Create a durable USER token (Account → Cloudflare Pages → Edit, Zone → Cache Purge, User → API Tokens → Edit) and store it as the CF_ROTATOR_TOKEN secret to enable two-token rotation."
            exit 0
          fi

          # cf METHOD URL BEARER [DATA] — call the Cloudflare API and echo the
          # response body to STDOUT on success. On any non-2xx it surfaces
          # Cloudflare's actual error object (code + message) via ::error:: and
          # returns 1, so a rejected call aborts with a diagnosable reason
          # instead of the bare `curl: (22) ... 400` that `curl -f` hides.
          # Diagnostics go to STDERR (>&2) on purpose: cf is always called inside
          # `x="$(cf ...)"`, which captures STDOUT — an ::error:: on stdout would
          # be swallowed into the variable and never reach the step log. stdout
          # carries only the response body (the function's return value). Safe to
          # print error bodies: a failed call carries no token value, the tokens
          # live only in Authorization headers (never a URL/body), and the minted
          # value is ::add-mask::ed before it's ever touched.
          cf() {
            local method="$1" url="$2" bearer="$3" data="${4:-}" out code body
            if [ -n "$data" ]; then
              out="$(curl -sS -X "$method" "$url" \
                -H "Authorization: Bearer $bearer" \
                -H "Content-Type: application/json" \
                --data "$data" -w $'\n%{http_code}')" \
                || { echo "::error::Network error calling ${url##*/client/v4}" >&2; return 1; }
            else
              out="$(curl -sS -X "$method" "$url" \
                -H "Authorization: Bearer $bearer" -w $'\n%{http_code}')" \
                || { echo "::error::Network error calling ${url##*/client/v4}" >&2; return 1; }
            fi
            code="${out##*$'\n'}"
            body="${out%$'\n'*}"
            if [ "${code#2}" = "$code" ]; then
              echo "::error::Cloudflare ${method} ${url##*/client/v4} -> HTTP ${code}: $(jq -c '.errors // .messages // .' <<<"$body" 2>/dev/null || printf '%s' "$body")" >&2
              return 1
            fi
            printf '%s' "$body"
          }

          # Normalise a policy ARRAY to a stable, comparable shape so we can
          # assert the minted token grants exactly the intended deploy policy.
          norm='[.[] | {effect, resources, pg: ([.permission_groups[].id] | sort)}] | sort'

          # 1. Identify the rotator itself so we never retire it by accident.
          rot_verify="$(cf GET "$api/user/tokens/verify" "$CF_ROTATOR_TOKEN")" || exit 1
          rotator_id="$(jq -r '.result.id' <<<"$rot_verify")"
          if [ -z "$rotator_id" ] || [ "$rotator_id" = "null" ]; then
            echo "::error::CF_ROTATOR_TOKEN did not verify. It must be a USER token (not account-owned) with 'User → API Tokens → Edit'."
            exit 1
          fi

          # 2. Build the DEPLOY policy from the rotator's own policies, dropping
          #    anything user-scoped (com.cloudflare.api.user.*) — that's the
          #    'API Tokens' management permission, which Cloudflare forbids on an
          #    API-minted token (error 1001) and which a deploy must never carry.
          #    What remains is exactly the account/zone-scoped Pages·Edit +
          #    Cache Purge. Deriving from the durable rotator makes run 1 == run N.
          rot_detail="$(cf GET "$api/user/tokens/$rotator_id" "$CF_ROTATOR_TOKEN")" || exit 1
          deploy_policies="$(jq -c '
            [ .result.policies[]
              | select(([.resources | keys[] | startswith("com.cloudflare.api.user.")] | any) | not)
              | {effect, resources, permission_groups: [.permission_groups[] | {id}]} ]' <<<"$rot_detail")"
          if [ "$(jq 'length' <<<"$deploy_policies")" -eq 0 ]; then
            echo "::error::Rotator has no non-user-scoped policies — it needs Account → Cloudflare Pages → Edit (and Zone → Cache Purge) so it can grant them to the deploy token."
            exit 1
          fi
          want_norm="$(jq -cS "$norm" <<<"$deploy_policies")"

          # 3. Note the CURRENT deploy token's id so we can retire it in step 7.
          #    Best-effort: if it can't be resolved (already invalid, or equal to
          #    the rotator on first run) we simply skip cleanup — orphan hygiene,
          #    never an outage.
          old_deploy_id=""
          if [ -n "${CF_DEPLOY_TOKEN:-}" ]; then
            old_verify="$(cf GET "$api/user/tokens/verify" "$CF_DEPLOY_TOKEN" 2>/dev/null || true)"
            old_deploy_id="$(jq -r '.result.id // empty' <<<"${old_verify:-}" 2>/dev/null || true)"
          fi

          # 4. Mint a NEW deploy-only token. No token-management perm, so
          #    Cloudflare accepts it; the old deploy token is untouched and stays
          #    valid, so deploys keep working throughout.
          payload="$(jq -cn --arg name "ineil77.dev Pages deploy (auto-rotated)" \
            --argjson policies "$deploy_policies" '{name:$name, policies:$policies}')"
          create="$(cf POST "$api/user/tokens" "$CF_ROTATOR_TOKEN" "$payload")" || exit 1
          new_id="$(jq -r '.result.id' <<<"$create")"
          new_val="$(jq -r '.result.value' <<<"$create")"
          if [ -z "$new_val" ] || [ "$new_val" = "null" ] || [ -z "$new_id" ] || [ "$new_id" = "null" ]; then
            echo "::error::Cloudflare did not return a new token id/value."
            exit 1
          fi
          echo "::add-mask::$new_val"

          # 5. GUARD: before overwriting the secret, confirm the new token (a)
          #    grants exactly the intended deploy policy and (b) authenticates as
          #    active. On any mismatch, delete the orphan and bail WITHOUT
          #    touching the secret — the old deploy token is still live, so
          #    deploys stay safe.
          new_detail="$(cf GET "$api/user/tokens/$new_id" "$CF_ROTATOR_TOKEN")" || exit 1
          new_norm="$(jq -cS '[.result.policies[] | {effect, resources, pg: ([.permission_groups[].id] | sort)}] | sort' <<<"$new_detail")"
          verify_new="$(cf GET "$api/user/tokens/verify" "$new_val")" || exit 1
          new_status="$(jq -r '.result.status' <<<"$verify_new")"
          if [ "$new_norm" != "$want_norm" ] || [ "$new_status" != "active" ]; then
            echo "::error::New deploy token is not a faithful, active copy (status=$new_status); deleting it and keeping the old token."
            echo "::group::normalized policy comparison (want vs new)"
            echo "want: $want_norm"
            echo "new:  $new_norm"
            echo "::endgroup::"
            cf DELETE "$api/user/tokens/$new_id" "$CF_ROTATOR_TOKEN" >/dev/null 2>&1 || true
            exit 1
          fi

          # 6. Persist the verified new deploy token; the next deploy reads it.
          printf '%s' "$new_val" | gh secret set CLOUDFLARE_API_TOKEN \
            --repo "${{ github.repository }}"

          # 7. Retire the PREVIOUS deploy token (best-effort, via the rotator).
          #    Never delete the rotator or the token we just minted.
          if [ -n "$old_deploy_id" ] && [ "$old_deploy_id" != "$rotator_id" ] && [ "$old_deploy_id" != "$new_id" ]; then
            if cf DELETE "$api/user/tokens/$old_deploy_id" "$CF_ROTATOR_TOKEN" >/dev/null 2>&1; then
              echo "Rotated deploy token: minted $new_id, persisted, retired $old_deploy_id."
            else
              echo "::warning::New deploy token $new_id is live and saved, but deleting old token $old_deploy_id failed (orphaned — remove it manually in the Cloudflare dashboard)."
            fi
          else
            echo "Rotated deploy token: minted $new_id, persisted. No prior deploy-only token to retire (first run, or old token is the rotator)."
          fi
