name: Build & Deploy

# Cloudflare Pages can't run this build itself (private CV source + a LuaLaTeX
# compile), so CI does the whole thing and ships the finished dist/ with wrangler.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated] # fired by Personal_CV when the CV changes

# A push to main and the CV's repository_dispatch both resolve github.ref to
# refs/heads/main, so they land in the same concurrency group. cancel-in-progress
# would make them cancel each other (showing up as spurious "cancelled" runs);
# queue them serially instead so both a code change and a CV update deploy fully.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CF_PAGES_PROJECT: ineil77-dev
  TEXLIVE_IMAGE: texlive/texlive:TL2025-historic

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Backstop so a hung run (e.g. a stalled LuaLaTeX compile) can't block the
    # serialized queue indefinitely now that runs no longer cancel each other.
    timeout-minutes: 20
    steps:
      # Mint a short-lived (1h) installation token from the CI GitHub App
      # instead of storing a long-lived PAT — used only to check out the private
      # CV repo below. Scoped to just that repo; auto-revoked when the job ends.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Personal_CV

      - name: Checkout website
        uses: actions/checkout@v7

      # Bring in the CV LaTeX sources as a plain checkout of Personal_CV's
      # main branch into cv-src/ (was a git submodule). Same "always build
      # against the latest CV" semantics, minus the .gitmodules bookkeeping and
      # the stale-pointer / forgotten-`--recursive` footguns. The App token
      # grants read on the private repo.
      - name: Checkout CV source (latest Personal_CV main)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/Personal_CV
          ref: main
          path: cv-src
          token: ${{ steps.app-token.outputs.token }}

      - name: Compile CV (LuaLaTeX, pinned TeX Live 2025)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/cv-src:/work" -w /work \
            "$TEXLIVE_IMAGE" \
            latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error cv.tex
          test -f cv-src/cv.pdf

      - name: Stage the compiled PDF
        run: cp cv-src/cv.pdf public/IndraneilCV.pdf

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (parses CV + astro build)
        env:
          CV_SRC_DIR: ${{ github.workspace }}/cv-src
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is an identifier, not a secret — stored as a repo variable.
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main
