name: Build & Deploy

# Cloudflare Pages can't run this build itself (private CV submodule + a LuaLaTeX
# compile), so CI does the whole thing and ships the finished dist/ with wrangler.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated] # fired by Personal_CV when the CV changes

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CF_PAGES_PROJECT: ineil77-dev
  TEXLIVE_IMAGE: texlive/texlive:TL2025-historic

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived (1h) installation token from the CI GitHub App
      # instead of storing a long-lived PAT. Scoped to just these two repos;
      # auto-revoked when the job ends.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ineil77.dev
            Personal_CV

      - name: Checkout (with private CV submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # App token grants read on both repos, so it fetches this repo and
          # the private Personal_CV submodule in one go.
          token: ${{ steps.app-token.outputs.token }}

      - name: Pull latest CV into the submodule
        run: git submodule update --remote --recursive cv-src

      - name: Compile CV (LuaLaTeX, pinned TeX Live 2025)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/cv-src:/work" -w /work \
            "$TEXLIVE_IMAGE" \
            latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error cv.tex
          test -f cv-src/cv.pdf

      - name: Stage the compiled PDF
        run: |
          mkdir -p public/cv
          cp cv-src/cv.pdf public/cv/indraneil-paul-cv.pdf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (parses CV + astro build)
        env:
          CV_SRC_DIR: ${{ github.workspace }}/cv-src
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is an identifier, not a secret — stored as a repo variable.
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main
