name: Build & Deploy

# Cloudflare Pages can't run this build itself (private CV source + a LuaLaTeX
# compile), so CI does the whole thing and ships the finished dist/ with wrangler.
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated] # fired by Personal_CV when the CV changes

# A push to main and the CV's repository_dispatch both resolve github.ref to
# refs/heads/main, so they land in the same concurrency group. cancel-in-progress
# would make them cancel each other (showing up as spurious "cancelled" runs);
# queue them serially instead so both a code change and a CV update deploy fully.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CF_PAGES_PROJECT: ineil77-dev
  TEXLIVE_IMAGE: texlive/texlive:TL2025-historic

jobs:
  deploy:
    # Pinned rather than ubuntu-latest so a runner-image migration can't silently
    # change the build environment on a long-idle pipeline; bump deliberately.
    runs-on: ubuntu-24.04
    # Backstop so a hung run (e.g. a stalled LuaLaTeX compile) can't block the
    # serialized queue indefinitely now that runs no longer cancel each other.
    timeout-minutes: 20
    steps:
      # Mint a short-lived (1h) installation token from the CI GitHub App
      # instead of storing a long-lived PAT — used only to check out the private
      # CV repo below. Scoped to just that repo; auto-revoked when the job ends.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Personal_CV

      - name: Checkout website
        uses: actions/checkout@v7

      # Bring in the CV LaTeX sources as a plain checkout of Personal_CV's
      # main branch into cv-src/ (was a git submodule). Same "always build
      # against the latest CV" semantics, minus the .gitmodules bookkeeping and
      # the stale-pointer / forgotten-`--recursive` footguns. The App token
      # grants read on the private repo.
      - name: Checkout CV source (latest Personal_CV main)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/Personal_CV
          ref: main
          path: cv-src
          token: ${{ steps.app-token.outputs.token }}

      - name: Compile CV (LuaLaTeX, pinned TeX Live 2025)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/cv-src:/work" -w /work \
            "$TEXLIVE_IMAGE" \
            latexmk -lualatex -interaction=nonstopmode -halt-on-error -file-line-error cv.tex
          test -f cv-src/cv.pdf

      - name: Stage the compiled PDF
        run: cp cv-src/cv.pdf public/IndraneilCV.pdf

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (parses CV + astro build)
        env:
          CV_SRC_DIR: ${{ github.workspace }}/cv-src
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is an identifier, not a secret — stored as a repo variable.
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main

      # Cloudflare Free floors browser/edge max-age to 4h, so after a deploy the
      # canonical URLs (the HTML pages + the résumé PDF) keep serving the stale
      # edge copy until the entry expires. Purge those specific, stable-named
      # URLs so a deploy shows up immediately. Content-hashed /_astro/* assets
      # are immutable and deliberately NOT purged. This step no-ops until
      # CLOUDFLARE_ZONE_ID is set AND the token carries Zone → Cache Purge; it's
      # best-effort (never fails an otherwise-good deploy — the cache self-heals
      # in ~4h) but logs a warning if the purge is rejected.
      - name: Purge Cloudflare edge cache for canonical URLs
        if: ${{ vars.CLOUDFLARE_ZONE_ID != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail
          resp="$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":[
              "https://ineil77.dev/",
              "https://ineil77.dev/cv",
              "https://ineil77.dev/cv/",
              "https://ineil77.dev/IndraneilCV.pdf"
            ]}')"
          if echo "$resp" | jq -e '.success == true' >/dev/null 2>&1; then
            echo "Purged canonical URLs from the Cloudflare edge cache."
          else
            echo "::warning::Cloudflare cache purge did not succeed (deploy is fine; cache self-heals in ~4h). Response: $resp"
          fi
