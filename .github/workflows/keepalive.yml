name: Keepalive

# ineil77.dev is a PUBLIC repo, so GitHub automatically DISABLES its scheduled
# workflows (here: the monthly Cloudflare token rotation) after ~60 days with no
# commits to the default branch. A scheduled workflow *running* does NOT reset
# that timer — only a commit does — so during a long deploy gap the rotation
# would silently stop firing.
#
# This job pushes a tiny empty commit twice a month to keep the 60-day clock
# alive. It's self-sustaining: each commit also resets the timer for THIS
# workflow. The push uses the default GITHUB_TOKEN, whose events do not trigger
# other workflows, so it never kicks off a deploy; the [skip ci] marker is
# belt-and-suspenders. The 8th/23rd cadence stays well inside 60 days even if a
# scheduled tick is skipped (GitHub can drop scheduled runs under load).
on:
  schedule:
    - cron: "0 5 8,23 * *" # 05:00 UTC on the 8th and 23rd of each month
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Empty commit to reset the 60-day scheduled-workflow timer
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive — reset scheduled-workflow timer [skip ci]"
          git push
